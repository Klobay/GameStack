name: gamestack
description: Personal video game tracker.
publish_to: none
version: 1.3.0+3
environment:
  sdk: ">=3.6.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  http: ^1.2.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/skyrim.png
    - assets/witcher.jpg
    - assets/rdr2.jpg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_regular.ttf
        - asset: assets/fonts/inter_medium.ttf
          weight: 500
        - asset: assets/fonts/inter_semibold.ttf
          weight: 600
        - asset: assets/fonts/inter_bold.ttf
          weight: 700
        - asset: assets/fonts/inter_extrabold.ttf
          weight: 800
